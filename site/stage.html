<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay · Beasty Bar AI</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  /* One game, full screen, for recording: stage.html?game=N (&speed=1.5). Space pauses. */
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 56px; align-items: center; padding: 0 72px; overflow: hidden; }
  #stage { max-width: 1300px; justify-self: center; }
  .side2 h5 { margin: 0 0 14px; font: 500 16px var(--sans); color: var(--muted); }
  .side2 .opt { grid-template-columns: 62px minmax(0, 150px) 1fr 58px; font-size: 17px; height: 34px; gap: 12px; }
  .side2 .opt .v { height: 9px; border-radius: 5px; } .side2 .opt .v i { border-radius: 5px; }
  .side2 .opt .n { font-size: 15px; }
  .side2 .chip { height: 28px; font-size: 15px; padding: 0 8px 0 6px; border-radius: 7px; } .side2 .chip svg { width: 18px; height: 18px; }
  .side2 .opts { min-height: 240px; align-content: start; }
  .cap { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); font: 500 20px/1.5 var(--sans); min-height: 120px; }
  .cap small { display: block; font: 500 15px var(--mono); color: var(--muted); margin-bottom: 6px; }
  .cap .chip { vertical-align: -7px; }
  .ticks { display: flex; gap: 3px; margin-top: 30px; }
  .ticks i { flex: 1; height: 8px; border-radius: 2px; background: var(--raise); }
  .ticks i.done.s0 { background: var(--a); } .ticks i.done.s1 { background: var(--b); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="side2">
  <h5 id="h"></h5>
  <div class="opts" id="opts"></div>
  <div class="cap" id="cap"></div>
  <div class="ticks" id="ticks"></div>
</div>
<script type="module">
import {load, decode, ANIMALS, animalOf} from "./engine.js";
import {Stage, describe, chip} from "./board.js";
import {GAMES} from "./games.js";

const q = new URLSearchParams(location.search), g = GAMES[+(q.get("game") || 0)];
const AGENT = {pimc8: "Search, 8 plies", pimc4: "Search, 4 plies", greedy: "Greedy", random: "Random"};
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const engine = await load("bb.wasm"), stage = new Stage($("stage"), {names: g.p.map(k => AGENT[k])});
stage.speed = +(q.get("speed") || 1);
let s = engine.newGame(g.seed, g.start), paused = false;
const states = [s];
for (const a of g.moves) states.push(s = engine.apply(a));
stage.set(states[0], {instant: true});
$("ticks").innerHTML = g.moves.map((_, i) => `<i class="s${states[i].toMove}"></i>`).join("");
addEventListener("keydown", e => { if (e.key === " ") paused = !paused; });

function label(state, action) {
  const m = decode(action), n = i => ANIMALS[animalOf(state.queue[i])];
  if (m.animal === 1) return "bounce " + n(m.params[0]);
  if (m.animal === 2 && m.params.length) return "hop " + m.params[0];
  if (m.animal === 4) return "copy " + n(m.params[0]);
  return ANIMALS[m.animal];
}
function options(i) {
  const st = states[i], vals = g.vals[i], chosen = g.moves[i], mover = st.toMove, rows = [];
  $("h").textContent = `Move ${i + 1}: what ${AGENT[g.p[mover]].toLowerCase()} sees`;
  if (vals) for (let k = 0; k < vals.length; k += 2) rows.push([vals[k], vals[k + 1]]);
  else rows.push([chosen, 0]);
  rows.sort((x, y) => y[1] - x[1]);
  const lo = Math.min(...rows.map(r => r[1])), hi = Math.max(...rows.map(r => r[1]));
  $("opts").innerHTML = rows.slice(0, 6).map(([a, v]) => `<div class="opt s${mover} ${a === chosen ? "pick" : ""}">${chip(mover * 12 + decode(a).animal)}<span class="lbl">${label(st, a)}</span>` +
    `<span class="v"><i style="width:${hi === lo ? 100 : 8 + 92 * (v - lo) / (hi - lo)}%"></i></span><span class="n">${(v > 0 ? "+" : "") + v.toFixed(1)}</span></div>`).join("");
}
document.documentElement.dataset.ready = "1";
await sleep(900);
for (let i = 0; i < g.moves.length; i++) {
  while (paused) await sleep(100);
  options(i);
  await sleep(520 / stage.speed);
  const d = await stage.move(states[i], g.moves[i], states[i + 1]);
  $("ticks").children[i].classList.add("done");
  const parts = [d.how, d.entered.length ? "in the bar " + d.entered.map(c => chip(c)).join(" ") : "",
    d.bounced.length || d.last !== null ? "out " + [...d.bounced, ...(d.last !== null ? [d.last] : [])].map(c => chip(c)).join(" ") : ""].filter(Boolean);
  $("cap").innerHTML = `<small>move ${i + 1} of ${g.moves.length}</small>${chip(d.card)} ${ANIMALS[d.animal]}${parts.length ? ": " + parts.join(", ") : ""}`;
  await sleep(700 / stage.speed);
}
const [a, b] = states.at(-1).scores;
$("cap").innerHTML = `<small>final</small>${AGENT[g.p[0]]} ${a} : ${b} ${AGENT[g.p[1]]}`;
await sleep(1800);
document.documentElement.dataset.done = "1";
</script>
</body>
</html>
